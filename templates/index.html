<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar de locales — Foodology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <h1>Radar de locales <em>Foodology</em></h1>
  </div>
  <div class="meta">
    <select id="citySel" class="city-sel"></select>
    <div class="modo-switch" id="modoSwitch">
      <button data-modo="delivery" class="on">Delivery</button>
      <button data-modo="fisico">Punto físico</button>
    </div>
    <span class="mode mode-{{ modo|replace(' ','') }}">modo {{ modo }}</span>
    <span class="net-count" id="netCount"></span>
  </div>
</header>

<main class="grid">
  <section class="panel">
    <div class="panel-head">
      <h2>Huecos detectados</h2>
      <p class="sub" id="gapSub">rankeados por score /12</p>
      <div class="plan-box">
        <span class="plan-lbl">📍 Plan de cobertura:</span>
        <button class="plan-btn" data-n="2">2</button>
        <button class="plan-btn" data-n="3">3</button>
        <button class="plan-btn" data-n="5">5</button>
        <span class="plan-lbl">cocinas</span>
        <button class="plan-clear" id="planClear" style="display:none">✕ ver todos</button>
      </div>
      <div id="planResult"></div>
    </div>
    <ol class="gaps" id="gapList"></ol>

    <div class="panel-head sticky">
      <h2>Evaluar dirección</h2>
      <p class="sub">Pega una dirección por línea. El radar la califica /12 con las mismas variables del mapa.</p>
    </div>
    <textarea id="locInput" placeholder="Av. Insurgentes Sur 1000, Del Valle, CDMX
Av. Chapultepec 480, Guadalajara"></textarea>
    <button id="scoreBtn">Evaluar y rankear</button>
    <div class="results" id="results"></div>
  </section>

  <section class="mapwrap">
    <div id="map"></div>
    <div class="legend">
      <span><i class="sw net"></i>Red propia</span>
      <span><i class="sw gap"></i>Hueco</span>
      <span><i class="sw loc"></i>Local evaluado</span>
      <label class="rings"><input type="checkbox" id="ringsTgl"> cobertura</label>
    </div>
  </section>
</main>

<script>
window.__CITIES__ = {{ ciudades|safe }};
window.__CITY__ = {{ ciudad|safe }};
window.__CFG__ = {{ cfg|safe }};
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
